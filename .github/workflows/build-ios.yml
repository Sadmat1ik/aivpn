name: Build Patched iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install xcodegen

      - name: Build iOS IPA
        run: |
          make ios

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aivpn-ios-patched
          path: releases/aivpn-ios.ipa
